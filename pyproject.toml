[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-accounting-core"
version = "0.1.0"
description = "Deterministic accounting kernel for Chinese small-scale VAT taxpayers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "ai-accounting-core contributors" }]
dependencies = [
  "argon2-cffi>=25.1,<26",
  "jsonschema>=4.25,<5",
  "jsonschema-rs==0.58.6",
  "mcp>=1.13,<2",
  "openpyxl>=3.1,<4",
  "pydantic>=2.11,<2.13",
  "xlrd>=2.0.2,<3",
  "pypdf>=6,<7",
  "pypinyin==0.55.0",
]

[project.optional-dependencies]
dev = [
  "uv==0.12.3",
  "xlwt>=1.3,<2",
  "cyclonedx-bom>=7.1,<8",
  "hypothesis>=6.135,<7",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "pyyaml>=6,<7",
]

[project.scripts]
finance-modular = "ai_accounting_modular.host.runtime.cli:main"

[tool.uv]
# Keep local and CI lock-file resolution on the same audited uv release.
required-version = "==0.12.3"

[tool.hatch.build.targets.wheel]
only-include = ["src/ai_accounting_modular"]
sources = ["src"]
artifacts = [
  "src/ai_accounting_modular/agent/_guides.json",
  "src/ai_accounting_modular/contracts/_schemas/*.json",
  "src/ai_accounting_modular/storage/schema/*.json",
  "src/ai_accounting_modular/reading/_templates/*.xlsx",
  "src/ai_accounting_modular/static/dashboard/**",
]

[tool.pytest.ini_options]
testpaths = ["tests/modular"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
