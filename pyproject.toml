[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-accounting-core"
version = "0.1.0"
description = "Deterministic accounting kernel for Chinese small-scale VAT taxpayers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "ai-accounting-core contributors" }]
dependencies = [
  "argon2-cffi>=25.1,<26",
  "mcp>=1.13,<2",
  "openpyxl>=3.1,<4",
  "pydantic>=2.11,<2.13",
  "xlwt>=1.3,<2",
  "xlrd>=2.0.2,<3",
  "pypdf>=6,<7",
]

[project.optional-dependencies]
dev = [
  "cyclonedx-bom>=7.1,<8",
  "hypothesis>=6.135,<7",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "jsonschema>=4.25,<5",
  "pyyaml>=6,<7",
]

[project.scripts]
finance-local = "ai_accounting.kernel.cli:main"

[tool.uv]
# Keep local and CI lock-file resolution on the same audited uv release.
required-version = "==0.12.3"

[tool.hatch.build.targets.wheel]
only-include = [
  "src/ai_accounting/__init__.py",
  "src/ai_accounting/kernel",
  "src/ai_accounting/payroll",
  "src/ai_accounting/bank_statements.py",
  "src/ai_accounting/bank_statement_schemas.py",
  "src/ai_accounting/borrowings.py",
  "src/ai_accounting/fixed_assets.py",
  "src/ai_accounting/intangible_assets.py",
  "src/ai_accounting/fact_requirements.py",
  "src/ai_accounting/mybank_export.py",
  "src/ai_accounting/financial_statement_template.py",
  "src/ai_accounting/templates/financial_reports",
  "src/ai_accounting/static/dashboard",
]
sources = ["src"]
artifacts = ["src/ai_accounting/static/dashboard/**"]
exclude = ["src/ai_accounting/kernel/security/legacy.py"]

[tool.pytest.ini_options]
testpaths = ["tests/kernel", "tests/pure"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
