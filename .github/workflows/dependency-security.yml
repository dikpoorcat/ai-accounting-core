name: Dependency security

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - uv.lock
  schedule:
    # Monday 01:00 Asia/Shanghai (Sunday 17:00 UTC).
    - cron: "0 17 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-security:
    name: SBOM and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7.5.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install the controlled Python runtime
        run: uv python install 3.12.13
      - name: Install the locked project and development tools
        run: uv sync --locked --all-extras --python 3.12.13 --managed-python
      - name: Verify installed dependencies
        run: uv pip check
      - name: Generate CycloneDX SBOM
        run: uv run cyclonedx-py environment --of JSON --output-file sbom.cdx.json
      - name: Generate dependency vulnerability report
        # DEC-026 A: never ignore or waive a scanner-reported vulnerability.
        run: uv run pip-audit --format json --output pip-audit.json
      - name: Upload SBOM and vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-security-reports
          path: |
            sbom.cdx.json
            pip-audit.json
          if-no-files-found: warn
          retention-days: 14
