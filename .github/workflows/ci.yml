name: V3 accounting kernel

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  standalone-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      UV_PROJECT_ENVIRONMENT: .tmp-kernel-venv
      UV_PYTHON_NO_REGISTRY: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7.5.0
        with:
          version: '0.12.3'
          enable-cache: true
      - name: Install controlled Python and locked dependencies
        run: |
          uv python install 3.12.13
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --extra dev --managed-python --python 3.12.13
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check --python .tmp-kernel-venv/Scripts/python.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check current design and generated contracts
        run: |
          uv run python tools/generate_modular_storage.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python tools/generate_modular_contracts.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python tools/check_modular_boundaries.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python tools/check_design.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test and build the dashboard
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run contracts:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Lint current code
        run: uv run ruff check src/ai_accounting_modular tests/modular tools
      - name: Test modules and integration
        run: uv run pytest tests/modular --ignore=tests/modular/acceptance/performance -q
      - name: Verify the independent wheel
        run: |
          uv build --wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv venv .tmp/distribution-env --managed-python --python 3.12.13
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtimePython = (Resolve-Path .tmp/distribution-env/Scripts/python.exe).Path
          uv export --locked --no-dev --no-emit-project --output-file .tmp/runtime-requirements.txt --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python $runtimePython --constraint .tmp/runtime-requirements.txt (Get-ChildItem dist -Filter '*.whl').FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location $env:RUNNER_TEMP
          & $runtimePython -I -B -X utf8 -m ai_accounting_modular.host.runtime.cli ids --count 2
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI failed' }
          & $runtimePython -I -B -c "import importlib.util; from ai_accounting_modular.storage.public import company_structure_contract; assert company_structure_contract()['kind'] == 'company'; assert importlib.util.find_spec('ai_accounting') is None"
          if ($LASTEXITCODE -ne 0) { throw 'Installed package verification failed' }
