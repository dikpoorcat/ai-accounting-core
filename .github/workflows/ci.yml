name: Local accounting kernel

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  standalone-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      UV_PROJECT_ENVIRONMENT: .tmp-kernel-venv
      UV_PYTHON_NO_REGISTRY: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7.5.0
        with:
          version: '0.12.3'
          enable-cache: true
      - name: Install controlled Python and locked dependencies
        run: |
          uv python install 3.12.13
          uv sync --locked --extra dev --managed-python --python 3.12.13
          uv run python -c "from ai_accounting.kernel.runtime import require_supported_runtime; require_supported_runtime()"
          uv pip check --python .tmp-kernel-venv/Scripts/python.exe
      - name: Check and build the single accounting page
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build:release
      - name: Lint active code
        run: uv run ruff check src/ai_accounting/kernel src/ai_accounting/payroll tests/kernel tests/pure scripts/package_local_kernel.py scripts/verify_local_package.py scripts/benchmark-local-kernel.py
      - name: Run default tests without database services or special collection flags
        run: uv run pytest
      - name: Build and verify the independent runtime
        run: ./scripts/package-local-kernel.ps1 -OutputDirectory .tmp-local-distribution/ci
